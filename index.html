function routeAim(){
 const stop=routeStop(),x=player.x,y=player.y;

 if(x>=1100&&y<850&&stop.region!=='garden')return Math.abs(y-665)>32?{x:1140,y:665}:{x:880,y:665};
 if(stop.region==='garden'&&x<1100){if(!data.gate1)return stations.find(s=>s.id==='gate1');return x<925&&Math.abs(y-665)>32?{x:880,y:665}:{x:1140,y:665};}
 if(stop.region==='tower'&&x<1310){if(!data.gate2)return stations.find(s=>s.id==='gate2');return x<925&&Math.abs(y-1145)>32?{x:850,y:1145}:{x:1380,y:1145};}

function pointIn(p,r,pad=0){return p.x>=r.x+pad&&p.x<=r.x+r.w-pad&&p.y>=r.y+pad&&p.y<=r.y+r.h-pad;}
function onLand(x,y){const p={x,y};return land.some((r,i)=>{if(i===1&&!data.gate1)return false;if(i===3&&!data.gate2)return false;return pointIn(p,r);})||platforms.some(r=>pointIn(p,r,2));}
function moveBlocked(x,y){if(x<100||y<140||x>1760||y>1290)return true;if(!data.gate1&&(x>840&&x<1110&&y>610&&y<720||x>=1100&&y<=820))return true;if(!data.gate2&&(x>825&&x<1320&&y>1100&&y<1205||x>=1310&&y>=960))return true;return false;}

function nearest(){const s=stations.filter(routeAvailable).map(s=>({...s,d:Math.hypot(s.x-player.x,s.y-player.y)})).sort((a,b)=>a.d-b.d)[0];return s&&s.d<(s.kind==='task'?85:112)?s:null;}
function interact(){if(modalOpen)return;if(active?.kind==='choice'){const index=choiceSpots.findIndex(p=>Math.abs(player.x-p.x)<=36&&player.y>=p.y-24&&player.y<=p.y+36);if(index>=0)answerChoice(index);else toast('Встань на плиту с нужной буквой, чтобы выбрать её.');return;}const s=nearest();if(!s){toast('Подойди к Пикселю, магазину или сундуку.');return;}if(active){toast('Сначала закончи задание или нажми «Позже».');return;}if(s.kind==='shop')shop();else if(s.kind==='task')startTask(s);else if(s.kind==='gate1'||s.kind==='gate2'){const req=s.kind==='gate1'?8:16;if(!gateReady(s.kind)){toast(`Пройди ${req} остановок маршрута. Сейчас ${Math.min(data.routeStep,req)}.`);return;}data[s.kind]=true;save();toast('Мост построен! Беги на новый остров.');burst(s.x,s.y,'#d8f2a8',35);}else if(s.kind==='chest'){if(data.collected.includes('chest'))toast('Сундук уже открыт. Впереди ещё задания и покупки!');else{data.collected.push('chest');reward(18);toast('Сундук найден! +18 монет ◆');}}else if(s.kind==='home')homePanel();}

function pickWord(){return routeStop().word;}
function marked(w){return w.pattern.replace(/\[([^\]]+)\]/g,'<mark>$1</mark>');}
function startTask(station){if(!routeAvailable(station)){toast('Следующая остановка: '+routeStop().name);return;}const i=station.word;active={i,kind:'',station:station.id,assisted:false,attempts:0};if(data.levels[i]===0)choiceTask();else if(data.levels[i]===1)assemblyTask();else recallTask();}
function choiceTask(){active.kind='choice';const w=WORDS[active.i];const matches=[...w.pattern.matchAll(/\[([^\]]+)\]/g)],match=matches[Math.floor(Math.random()*matches.length)],correct=match[1];const variants=[correct];const substitutions={'а':'о','о':'а','е':'и','и':'е','ю':'у','с':'сс','сс':'с','в':'','кк':'к','ш':'ж','д':'т','т':'д','з':'с'};let wrong=substitutions[correct]??'а';variants.push(wrong);for(const v of ['и','о','а','е','у','с','к'])if(variants.length<3&&!variants.includes(v))variants.push(v);active.options=variants.map(v=>({letter:v||'—',value:v})).sort(()=>Math.random()-.5);active.correct=correct;
 // Выводим ровно один пропуск, сохраняя остальные части исходного слова.
 let taken=false;active.mask=w.pattern.replace(/\[([^\]]+)\]/g,(full,part,offset)=>{if(offset===match.index&&!taken){taken=true;return '□'.repeat(part.length);}return part;});
 const stop=stops.find(s=>s.id===active.station),bounds=stop.region==='main'?{left:215,right:790,top:270,bottom:1100}:stop.region==='garden'?{left:1225,right:1635,top:300,bottom:745}:{left:1435,right:1625,top:1060,bottom:1235};
 const anchor={x:Math.max(bounds.left,Math.min(bounds.right,stop.x)),y:Math.max(bounds.top,Math.min(bounds.bottom,stop.y+80))};
 if(stop.id==='butterfly'||stop.id==='crystal')anchor.y=stop.y-80;
 choiceSpots.splice(0,3,...[-1,0,1].map(i=>({x:anchor.x+i*85,y:anchor.y})));
 target=null;$('quest').hidden=true;$('challenge').hidden=false;
 $('challenge').innerHTML='<span class="label">ОСТАНОВКА '+(stop.word+1)+'/21 · +8 МОНЕТ</span><h2>'+active.mask+'</h2><p>Встань на плиту с нужной буквой и нажми «Выбрать».</p><button id="later">Позже</button>';
 $('later').onclick=cancelTask;
}
function answerChoice(index){if(active?.kind!=='choice')return;const w=WORDS[active.i];if(active.options[index].value!==active.correct){active.assisted=true;active.attempts++;data.errors[active.i]++;save();burst(player.x,player.y,'#efab83',10);toast('Вспомни: '+w.w+'. '+w.note,5);$('challenge').querySelector('h2').textContent=w.w;return;}if(!active.assisted)data.levels[active.i]=Math.max(1,data.levels[active.i]);finishStop(8);}

function bindWordHint(){

function checkPanelAnswer(value,amount){const w=WORDS[active.i];if(!value){toast('Сначала составь или напиши слово.');return;}if(value!==w.w){if(!active.attempts)data.errors[active.i]++;active.attempts++;active.assisted=true;if(active.kind==='recall')data.levels[active.i]=Math.min(data.levels[active.i],2);save();$('result').className='feedback bad';$('result').innerHTML='Правильно: <b>'+marked(w)+'</b>.<br>'+w.note+'<br>Попробуй ещё раз. Сундук подождёт.';return;}if(!active.assisted)data.levels[active.i]=Math.min(3,data.levels[active.i]+1);else if(active.kind==='recall')data.levels[active.i]=Math.min(data.levels[active.i],2);finishStop(amount);}

 const slimeX=1220+Math.sin(time*.8)*120;if(player.z<28&&Math.hypot(player.x-slimeX,player.y-650)<37){respawn();toast('Слизень щекочется! Перепрыгни его пробелом или кнопкой ↑.');}
 for(const c of crystals)if(!data.collected.includes(c.id)&&Math.hypot(player.x-c.x,player.y-c.y)<28){data.collected.push(c.id);reward(2,c.x,c.y);toast('+2 монеты ◆');}
 petPos.x+=(player.x-30-petPos.x)*Math.min(1,dt*3);petPos.y+=(player.y+23-petPos.y)*Math.min(1,dt*3);
 }
 updateActionUI();camera.x+=(player.x-camera.x)*Math.min(1,dt*7);camera.y+=(player.y-25-camera.y)*Math.min(1,dt*7);particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;return p.life>0;});if(time>toastUntil)$('toast').hidden=true;draw();requestAnimationFrame(tick);}
function resetStick(){joy={x:0,y:0};$('stick').style.transform='';}
let joyPointer=null;
$('joystick').addEventListener('pointerdown',e=>{if(modalOpen)return;joyPointer=e.pointerId;e.currentTarget.setPointerCapture(e.pointerId);updateJoy(e);});
function updateJoy(e){if(joyPointer!==e.pointerId)return;const r=$('joystick').getBoundingClientRect(),radius=(r.width-48)/2-3,dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),f=Math.min(1,radius/(len||1));joy={x:dx*f/radius,y:dy*f/radius};$('stick').style.transform=`translate(${dx*f}px,${dy*f}px)`;}
$('joystick').addEventListener('pointermove',updateJoy);for(const type of ['pointerup','pointercancel','lostpointercapture'])$('joystick').addEventListener(type,()=>{joyPointer=null;resetStick();});
addEventListener('keydown',e=>{if(modalOpen){if(e.key==='Escape'){e.preventDefault();closePanel();}if(e.key==='Tab'){const els=[...$('panel').querySelectorAll('button:not(:disabled),input')];const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(!e.repeat){if(e.key===' ')jump();if(e.key.toLowerCase()==='e')interact();}});
addEventListener('keyup',e=>{keys[e.key]=false;});addEventListener('blur',()=>{keys={};resetStick();target=null;save();});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys={};resetStick();target=null;save();}});
canvas.addEventListener('pointerdown',e=>{if(modalOpen)return;const scale=width<600?1:1.06;target={x:(e.clientX-width/2)/scale+camera.x,y:(e.clientY-height*.55)/scale+camera.y};});
$('jump').onclick=jump;$('interact').onclick=interact;$('book').onclick=()=>{if(active){toast('Закончи задание или нажми «Позже».');return;}notebook();};$('help').onclick=()=>{if(active){toast('Закончи задание или нажми «Позже».');return;}help();};
if(Number.isFinite(data.x)&&Number.isFinite(data.y)&&onLand(data.x,data.y)&&!moveBlocked(data.x,data.y)){player.x=data.x;player.y=data.y;player.safeX=data.x;player.safeY=data.y;}petPos={x:player.x-30,y:player.y+23};camera={x:player.x,y:player.y-25};save();requestAnimationFrame(tick);if(!data.intro)welcome();
